[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/php-fpm.err.log
stdout_logfile=/var/log/supervisor/php-fpm.out.log

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile=/var/log/supervisor/nginx.out.log

[program:laravel-setup]
command=/bin/sh -c "php /var/www/html/artisan migrate --force && php /var/www/html/artisan config:cache && php /var/www/html/artisan route:cache && php /var/www/html/artisan view:cache"
autostart=true
autorestart=false
startsecs=0
priority=1
stdout_logfile=/var/log/supervisor/laravel-setup.out.log
stderr_logfile=/var/log/supervisor/laravel-setup.err.log
